# This file contains the configuration for this project.
# `info` is kept as reference. The Windows build metadata lives in
# build/windows/info.json and build/windows/wails.exe.manifest.
# If you change the version or company, update those two files manually.
version: '3'

# Reference metadata. The Windows build reads build/windows/info.json instead.
info:
  companyName: "saulopezf" # The name of the company
  productName: "daeva-meter" # The name of the application
  productIdentifier: "com.saulopezf.daevameter" # The unique product identifier
  description: "Medidor de DPS para Aion 2" # The application description
  copyright: "(c) 2026, saulopezf" # Copyright text
  comments: "Medidor de DPS pasivo para Aion 2" # Comments
  version: "0.1.0" # The application version

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
      # The standard frontend task waits up to 60s for HTTP 200 from
      # FRONTEND_DEVSERVER_URL before starting the app. Override if needed;
      # custom background commands can opt in with the same readiness block.
      # readiness:
      #   http: "http://localhost:5173/"
      #   timeout: "60s"
      #   interval: "200ms"
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
